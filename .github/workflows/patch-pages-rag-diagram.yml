name: Patch Pages RAG diagram

on:
  push:
    paths:
      - ".github/workflows/patch-pages-rag-diagram.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagram
        run: |
          echo '' | base64 -d > /tmp/patch_contextual.py
          python3 /tmp/patch_contextual.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix responsive RAG ASCII diagram"
          git push
