name: Patch Pages RAG diagram

on:
  push:
    paths:
      - ".github/scripts/patch_pages_rag.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diagram
        run: python3 .github/scripts/patch_pages_rag.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix responsive RAG ASCII diagram"
          git push
